
<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="manifest" href="/GarantiCoilApp/manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/GarantiCoilApp/icon-192.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coil Length Calculator</title>


<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f4f8;
  color: #1e293b;
}

.container {
  max-width: 460px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 25px #00000012;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.factory-logo {
    display: block;
    max-width: 180px;
    max-height: 90px;
    width: auto;
    height: auto;
    object-fit: contain;
    margin: 10px auto 20px;
}

.header h2 {
  margin-bottom: 5px;
  color: #17365d;
}

.header p {
  color: #64748b;
  font-size: 13px;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 9px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 9px;
  font-size: 19px;
}

.presets {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.presetsKg {
display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.presets button {
  padding: 12px 3px;
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.presetsKg button {
  padding: 12px 3px;
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
.presets button.active {
  background: #17365d;
  color: white;
  border-color: #17365d;
}

.presetsKg button.active {
  background: #17365d;
  color: white;
  border-color: #17365d;
}
.result {
  margin-top: 25px;
  padding: 22px;
  text-align: center;
  background: #eaf4ff;
  border-radius: 12px;
}

.resultKg {
  margin-top: 25px;
  padding: 22px;
  text-align: center;
  background: #eaf4ff;
  border-radius: 12px;
}
.result p {
  margin: 0;
  color: #475569;
}

.resultKg p{
  margin: 0;
  color: #696547;
}

.result h1 {
  margin: 12px 0 0;
  color: #087443;
  font-size: 38px;
}

.resultKg h1 {
  margin: 12px 0 0;
  color: #744908;
  font-size: 38px;
}
.info {
  margin-top: 20px;
  color: #64748b;
  font-size: 13px;
  line-height: 1.7;
}

.language {
  text-align: right;
}

.language button {
  padding: 7px 12px;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}



</style>
</head>

<body>

<div class="container">

  <div class="language">
    <button onclick="setLanguage('tr')">TR</button>
    <button onclick="setLanguage('en')">EN</button>
  </div>

  <div class="header">

    <img src="images/logo.png"
         alt="Factory Logo"
         class="factory-logo">

    <h2 id="title">BOBİN METRAJ HESAPLAMA</h2>
    <p id="subtitle">Kalan sac (uzunluğu / Kg) hesaplama</p>

</div>

  <label id="thicknessLabel">Sac kalınlığı (mm)</label>

  <div class="presets" id="presets"> </div>

  <input
    id="thickness"
    type="number"
    value="0.50"
    min="0.01"
    step="0.01"
    oninput="calculate()"
  >

  <label id="measurementLabel">
    Kalan sarım kalınlığı (cm)
  </label>
  

  <input
    id="measurement"
    type="number"
    value="2"
    min="0"
    step="0.01"
    oninput="calculate()"
  >

  <div class="result">
    <p id="resultLabel">KALAN METRAJ</p>
    <h1 id="result">65.35 m</h1>
  </div>

  <div class="KgCalc">
    
    <label id= "measurementwidth">
      Bobin Genişliği (mm)
    </label>
<div class="presetsKg" id="presetsKg"></div>
    
<input
    id="width"
    type="number"
    value="1200"
    min="1"
    step="1"
    oninput="calculate()"
  >
  </div>

    <div class="resultKg">
    <p id="resultLabelkg">KALAN KG</p>
    <h1 id="resultkg">307.80 Kg</h1>
  </div>

  <div class="info">
    <div id="innerDiameter">
      Sabit iç çap: 50 cm
    </div>
    <div id="measurementInfo">
      Ölçüm: İç çekirdekten dış sarım kenarına kadar.
    </div>
  </div>

</div>

<script>
const innerDiameterCm = 50;

const thicknessOptions = [
  "0.20", "0.25", "0.30", "0.35",
  "0.40", "0.45", "0.47", "0.50"
];

const widthOptions = [
  "1250", "1200", "1130", "1070"
];

let language = "tr";

const translations = {
  tr: {
    title: "BOBİN METRAJ HESAPLAMA",
    subtitle: "Kalan sac (uzunluğu / Kg) hesaplama",
    thickness: "Sac kalınlığı (mm)",
    width: "Bobin Genişliği (mm)",
    measurement: "Kalan sarım kalınlığı (cm)",
    result: "KALAN METRAJ",
    resultkg: "KALAN KG",
    inner: "Sabit iç çap: 50 cm",
    info: "Ölçüm: İç çekirdekten dış sarım kenarına kadar.",
    error: "Geçerli değerleri giriniz"
  },
  en: {
    title: "COIL LENGTH CALCULATOR",
    subtitle: "Remaining metal sheet (length / Kg)",
    thickness: "Metal thickness (mm)",
    width: "Metal Sheet Width (mm)",
    measurement: "Remaining coil thickness (cm)",
    result: "REMAINING LENGTH",
    resultkg: "REMAINING KG",
    inner: "Fixed inner diameter: 50 cm",
    info: "Measure from the core surface to the outer coil edge.",
    error: "Please enter valid values"
  }
};

function setLanguage(lang) {
  language = lang;
  const t = translations[lang];

  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("thicknessLabel").textContent = t.thickness;
  document.getElementById("measurementwidth").textContent = t.width;
  document.getElementById("measurementLabel").textContent = t.measurement;
  document.getElementById("resultLabelkg").textContent = t.resultkg;
  document.getElementById("resultLabel").textContent = t.result;
  document.getElementById("innerDiameter").textContent = t.inner;
  document.getElementById("measurementInfo").textContent = t.info;

  calculate();
}

function createPresets() {
  const container = document.getElementById("presets");

  thicknessOptions.forEach(value => {
    const button = document.createElement("button");
    button.textContent = value;
    button.onclick = () => {
      document.getElementById("thickness").value = value;
      calculate();
    };
    container.appendChild(button);
  });
}

function createPresetsKg() {
  const container = document.getElementById("presetsKg");

  widthOptions.forEach(value => {
    const button = document.createElement("button");
    button.textContent = value;
    button.onclick = () => {
      document.getElementById("width").value = value;
      calculate();
    };
    container.appendChild(button);
  });
}


function calculate() {
  const thickness = Number(
    document.getElementById("thickness").value
  );

  const width = Number(
    document.getElementById("width").value
  );

  const h = Number(
    document.getElementById("measurement").value
  );

  const resultElement = document.getElementById("result");
  const resultElementkg = document.getElementById("resultkg");

  if (!Number.isFinite(thickness) ||
    !Number.isFinite(h) ||
    !Number.isFinite(width) ||
    thickness <= 0 ||
    h <= 0 ||
    width <= 0) {
    resultElement.textContent = translations[language].error;
    return;
  }

  // Result in metres.
  // h is in cm, thickness is in mm.
  const length =
    Math.PI * h * (h + innerDiameterCm) /
    (10 * thickness);

const kg = length * thickness*7.85 *(width/1000);

  resultElement.textContent =
    length.toLocaleString(
      language === "tr" ? "tr-TR" : "en-US",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 }
    ) + " m";

resultElementkg.textContent =
    kg.toLocaleString(
        language === "tr" ? "tr-TR" : "en-US",
        { minimumFractionDigits: 2, maximumFractionDigits: 2 }
    ) + " Kg";

  document.querySelectorAll(".presets button").forEach(button => {
    button.classList.toggle(
      "active",
      Number(button.textContent) === thickness
    );
  });
  document.querySelectorAll(".presetsKg button").forEach(button => {
    button.classList.toggle(
        "active",
        Number(button.textContent) === width
    );
});
}

createPresets();
createPresetsKg();
calculate();
</script>
</body>
</html>
